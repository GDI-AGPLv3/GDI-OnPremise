# ============================================================
# GDI OnPremise — Núcleo de GDI
# Instalación por imágenes: los 10 servicios de GDI se bajan ya armados desde
# ghcr.io/gdi-live (requiere el token que entrega GDI Latam). En el servidor NO se
# compila nada ni se clona código de la aplicación.
#
# IMAGE_VERSION (en el .env) es UNA sola versión para todo el set.
# Se usa junto con el overlay premium (BackOffice + IA) y, si corresponde, MinIO:
#   docker compose -f docker-compose.yml -f docker-compose.premium.yml -f docker-compose.minio.yml up -d
# ============================================================

name: gdi

networks:
  gdi_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  npm_data:
  npm_letsencrypt:

services:
  # ---------- Base de datos ----------
  postgres:
    image: ghcr.io/gdi-live/postgres:${IMAGE_VERSION:?definí IMAGE_VERSION en el .env}
    # SIN seed demo: crea public + catálogos globales, sin el tenant 100_test

    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [gdi_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- Cache (opcional pero recomendado) ----------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [gdi_net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Runner de migraciones (corre y termina) ----------
  # Aplica las migraciones SQL pendientes a la BD ANTES de que arranque el backend.
  # El runner y las migraciones vienen DENTRO de la imagen: cambiar IMAGE_VERSION trae las nuevas.
  migrator:
    image: ghcr.io/gdi-live/migrator:${IMAGE_VERSION:?definí IMAGE_VERSION en el .env}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      MIGRATIONS_DIR: /migrations
    networks: [gdi_net]

  # ---------- Microservicios internos (PDFs y firma) ----------
  pdfcomposer:
    image: ghcr.io/gdi-live/pdfcomposer:${IMAGE_VERSION:?definí IMAGE_VERSION en el .env}
    restart: unless-stopped
    environment:
      # El servicio lee API_KEY (app/config.py); PDFCOMPOSER_API_KEY es el nombre en el .env.
      API_KEY: ${PDFCOMPOSER_API_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      # gunicorn_conf.py necesita estas tres. Sin PORT cae a :8000 y el backend
      # (PDFCOMPOSER_URL) le habla al :8080: quedaria inalcanzable sin dar error.
      PORT: "8080"
      GUNICORN_WORKERS: ${PDFCOMPOSER_WORKERS:-2}
      GUNICORN_TIMEOUT: ${PDFCOMPOSER_TIMEOUT:-120}
    networks: [gdi_net]
    # Sin puerto expuesto al host: solo lo usa el backend por la red interna (:8080)

  notary:
    image: ghcr.io/gdi-live/notary:${IMAGE_VERSION:?definí IMAGE_VERSION en el .env}
    restart: unless-stopped
    environment:
      # El servicio lee API_KEY (app/config.py); NOTARY_API_KEY es el nombre en el .env.
      API_KEY: ${NOTARY_API_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      # gunicorn_conf.py las exige con os.environ[...] (sin default): sin ellas
      # el contenedor no arranca y no hay firma digital.
      PORT: "8080"
      GUNICORN_WORKERS: ${NOTARY_WORKERS:-4}
      GUNICORN_TIMEOUT: ${NOTARY_TIMEOUT:-90}
      # Storage (Notary lee/escribe PDFs firmados en R2/MinIO)
      CF_R2_ENDPOINT: ${CF_R2_ENDPOINT}
      CF_R2_ACCESS_KEY_ID: ${CF_R2_ACCESS_KEY_ID}
      CF_R2_SECRET_ACCESS_KEY: ${CF_R2_SECRET_ACCESS_KEY}
    networks: [gdi_net]

  # ---------- Backend principal ----------
  backend:
    image: ghcr.io/gdi-live/backend:${IMAGE_VERSION:?definí IMAGE_VERSION en el .env}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      # Modo (cierra /docs, /redoc, /openapi.json)
      ENVIRONMENT: production
      # Base de datos
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      # Cache
      REDIS_URL: redis://redis:6379/0
      # Auth0 (el backend valida el JWT)
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      # Si el .env no la define, se deriva de AUTH0_DOMAIN. OJO: no dejarla vacia
      # (${AUTH0_ISSUERS:-}) porque database.py usa os.getenv con default, y ese
      # default aplica solo si la variable NO existe: vacia rompe el arranque.
      AUTH0_ISSUERS: ${AUTH0_ISSUERS:-https://${AUTH0_DOMAIN}/}
      # CORS: orígenes permitidos (URL pública del frontend)
      FRONTEND_URL: ${FRONTEND_URL}
      # Microservicios internos (todos escuchan en :8080)
      PDFCOMPOSER_URL: http://pdfcomposer:8080
      PDFCOMPOSER_API_KEY: ${PDFCOMPOSER_API_KEY}
      NOTARY_URL: http://notary:8080
      NOTARY_API_KEY: ${NOTARY_API_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      # Descifra la contraseña de los certificados de firma y los secretos de webhooks
      # (Fernet). Sin esto, firmar con certificado falla con "CERT_MASTER_KEY no configurada".
      CERT_MASTER_KEY: ${CERT_MASTER_KEY:?falta CERT_MASTER_KEY en el .env (correr scripts/generar-claves.sh)}
      CERT_R2_BUCKET: ${CERT_R2_BUCKET:-gdi-certificates}
      # Almacenamiento (R2 o MinIO — ver .env)
      CF_R2_ENDPOINT: ${CF_R2_ENDPOINT}
      CF_R2_ACCESS_KEY_ID: ${CF_R2_ACCESS_KEY_ID}
      CF_R2_SECRET_ACCESS_KEY: ${CF_R2_SECRET_ACCESS_KEY}
      CF_R2_BUCKET_OFICIAL: ${CF_R2_BUCKET_OFICIAL}
      CF_R2_BUCKET_TOSIGN: ${CF_R2_BUCKET_TOSIGN}
      # Avatares: bucket global (no per-tenant) + la URL desde donde el navegador
      # los pide. Los sirve el reverse proxy en /avatars del dominio de la API.
      CF_R2_BUCKET_AVATARS: ${CF_R2_BUCKET_AVATARS:-gdi-avatars}
      CF_R2_AVATARS_PUBLIC_URL: ${CF_R2_AVATARS_PUBLIC_URL:-${NEXT_PUBLIC_API_URL}/avatars}
      # Email (Resend si hay key; SMTP si hay host; si no, silencioso)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Sin default: 'noreply@localhost' no es un remitente valido para ningun
      # servidor de correo real. Lo pone el municipio en su .env.
      FROM_EMAIL: ${FROM_EMAIL:-}
      ALERT_TO_EMAIL: ${ALERT_TO_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
    networks: [gdi_net]
    healthcheck:
      # /health responde 200 sano, 503 si la BD no está lista. start_period da margen a las migraciones.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ---------- MCP Gateway ----------
  gateway:
    image: ghcr.io/gdi-live/gateway:${IMAGE_VERSION:?definí IMAGE_VERSION en el .env}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      ENVIRONMENT: production
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      AGENT_GATEWAY_SECRET: ${AGENT_GATEWAY_SECRET:-${INTERNAL_API_KEY}}
      # Lo de abajo sale del fly.gateway.toml, que no se publica. Sin esto el
      # gateway arranca y responde healthy, pero le falta a donde llamar: los
      # modulos de firma y PDF hacen raise al importarse sin estas URLs.
      AUTH0_ISSUERS: ${AUTH0_ISSUERS:-https://${AUTH0_DOMAIN}/}
      PDFCOMPOSER_URL: http://pdfcomposer:8080
      PDFCOMPOSER_API_KEY: ${PDFCOMPOSER_API_KEY}
      NOTARY_URL: http://notary:8080
      NOTARY_API_KEY: ${NOTARY_API_KEY}
      # Misma clave que el backend: firma por MCP/REST con certificado y webhooks de TAD.
      CERT_MASTER_KEY: ${CERT_MASTER_KEY:?falta CERT_MASTER_KEY en el .env (correr scripts/generar-claves.sh)}
      CERT_R2_BUCKET: ${CERT_R2_BUCKET:-gdi-certificates}
      # URL publica del propio gateway: es el audience que valida el MCP.
      MCP_RESOURCE_URI: ${GATEWAY_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      TESTING_MODE: "false"
      CF_R2_SIGN_EXPIRATION: ${CF_R2_SIGN_EXPIRATION:-600}
      GUNICORN_WORKERS: ${GATEWAY_WORKERS:-2}
      ASYNCPG_MIN_SIZE: ${ASYNCPG_MIN_SIZE:-2}
      ASYNCPG_MAX_SIZE: ${ASYNCPG_MAX_SIZE:-8}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
      PYTHONUNBUFFERED: "1"
      # Avatares: bucket global (no per-tenant) + la URL desde donde el navegador
      # los pide. Los sirve el reverse proxy en /avatars del dominio de la API.
      CF_R2_BUCKET_AVATARS: ${CF_R2_BUCKET_AVATARS:-gdi-avatars}
      CF_R2_AVATARS_PUBLIC_URL: ${CF_R2_AVATARS_PUBLIC_URL:-${NEXT_PUBLIC_API_URL}/avatars}
      # EMAIL_SERVICE_URL no va: on-premise el correo lo manda el BackOffice,
      # no hay microservicio de email separado como en la nube.
    networks: [gdi_net]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/.well-known/mcp.json').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------- Frontend ----------
  frontend:
    image: ghcr.io/gdi-live/frontend:${IMAGE_VERSION:?definí IMAGE_VERSION en el .env}
    restart: unless-stopped
    depends_on: [backend]
    environment:
      # URL pública de la API. La imagen trae un marcador y su entrypoint lo reemplaza
      # al arrancar: cambiar el dominio es editar el .env y reiniciar, no recompilar.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      # Auth0 — app del frontend (portal de usuarios)
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_CLIENT_ID: ${AUTH0_FRONTEND_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${AUTH0_FRONTEND_CLIENT_SECRET}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      AUTH0_SECRET: ${AUTH0_SECRET}
      AUTH0_BASE_URL: ${FRONTEND_URL}
    networks: [gdi_net]
    # Next.js escucha en :3000 internamente; npm lo proxea a :443

  # ---------- Reverse proxy + SSL (UI web) ----------
  npm:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    depends_on: [frontend, backend]
    ports:
      - "80:80"     # HTTP (redirige a HTTPS)
      - "443:443"   # HTTPS (frontend + API)
      # Panel de administracion: SOLO en localhost. Expuesto a internet, cualquiera
      # que llegue antes que el municipio completa el setup inicial y se queda con el
      # proxy (un POST /api/users sin autenticar alcanza). Se accede por tunel SSH:
      #   ssh -L 8181:localhost:81 usuario@servidor   ->  http://localhost:8181
      - "127.0.0.1:81:81"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks: [gdi_net]
