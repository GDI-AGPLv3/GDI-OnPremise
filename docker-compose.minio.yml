# ============================================================
# GDI OnPremise — Almacenamiento local con MinIO
# Para municipios sin Cloudflare R2 o sin internet confiable.
# MinIO habla el protocolo S3, así que el backend lo usa SIN cambios de código.
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.minio.yml up -d
#
# En el .env, apuntá las variables de R2 a MinIO:
#   CF_R2_ENDPOINT=http://minio:9000
#   CF_R2_ACCESS_KEY_ID=${MINIO_ROOT_USER}
#   CF_R2_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
# ============================================================

volumes:
  minio_data:

services:
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?definí MINIO_ROOT_PASSWORD en el .env}
    volumes:
      - minio_data:/data
    networks: [gdi_net]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -fsS http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    # :9000 (API S3) y :9001 (consola web) quedan SOLO en la red interna.
    # Si querés ver la consola, exponé 9001 temporalmente o accedé por npm.

  # Los buckets de DOCUMENTOS no se precrean: cada municipio crea los suyos
  # (gdi-<sigla>-oficial / -tosign / -publico / -preoficial) cuando se lo da de alta
  # desde el wizard del BackOffice.
  #
  # El de AVATARES es distinto: es UNO SOLO para toda la instalación, con una carpeta
  # por municipio adentro ({schema}/{uuid}.webp). Como no pertenece a ningún municipio,
  # el wizard no lo crea nunca — en la nube existe desde siempre, hecho a mano. Este
  # servicio lo crea al levantar, para que subir una foto de perfil no falle con
  # "Bucket de avatares no configurado".
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?definí MINIO_ROOT_PASSWORD en el .env}
      BUCKET_AVATARS: ${CF_R2_BUCKET_AVATARS:-gdi-avatars}
      BUCKET_CERTS: ${CERT_R2_BUCKET:-gdi-certificates}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing \"local/$$BUCKET_AVATARS\" &&
      mc anonymous set download \"local/$$BUCKET_AVATARS\" &&
      mc mb --ignore-existing \"local/$$BUCKET_CERTS\" &&
      echo '[OK] buckets listos: '$$BUCKET_AVATARS' (lectura publica) y '$$BUCKET_CERTS' (privado)'
      "
    restart: "no"
    networks: [gdi_net]
    # Lectura anónima SOLO en el de avatares: las fotos de perfil las pide el navegador
    # del usuario por HTTP. Los documentos NO se tocan: siguen privados.
    # El de CERTIFICADOS de firma también es uno solo para la instalación (una carpeta
    # por municipio) y el wizard no lo crea: se crea acá, PRIVADO. Sin él, cargar un
    # certificado da NoSuchBucket.
