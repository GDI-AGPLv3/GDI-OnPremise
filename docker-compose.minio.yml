# ============================================================
# GDI OnPremise — Almacenamiento local con MinIO
# Para municipios sin Cloudflare R2 o sin internet confiable.
# MinIO habla el protocolo S3, así que el backend lo usa SIN cambios de código.
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.minio.yml up -d
#
# En el .env, apuntá las variables de R2 a MinIO:
#   CF_R2_ENDPOINT=http://minio:9000
#   CF_R2_ACCESS_KEY_ID=${MINIO_ROOT_USER}
#   CF_R2_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
# ============================================================

volumes:
  minio_data:

services:
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?definí MINIO_ROOT_PASSWORD en el .env}
    volumes:
      - minio_data:/data
    networks: [gdi_net]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -fsS http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    # :9000 (API S3) y :9001 (consola web) quedan SOLO en la red interna.
    # Si querés ver la consola, exponé 9001 temporalmente o accedé por npm.

  # NOTA: no se precrean buckets fijos. Cada instancia (municipio) crea sus propios
  # buckets per-tenant (gdi-<sigla>-oficial / -tosign) cuando se la da de alta desde
  # el wizard del BackOffice. MinIO arranca vacío y se va poblando solo.
