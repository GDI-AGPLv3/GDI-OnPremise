# ============================================================
# GDI OnPremise — Tier Premium (módulos pagos)
# Se SUPERPONE al docker-compose.yml. Las imágenes se bajan de ghcr.io
# (requiere token que entrega GDI al vender) y se desbloquean con el .lic.
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.premium.yml up -d
# ============================================================

services:
  # El backend ahora puede hablar con AgenteLANG (IA) y suma el backoffice al CORS
  backend:
    environment:
      AGENT_URL: http://agentelang:8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      # CORS: frontend de usuarios + backoffice (lista separada por coma, el código la soporta)
      FRONTEND_URL: ${FRONTEND_URL},${BACKOFFICE_URL}

  # ---------- BackOffice Back (administración) ----------
  backoffice-back:
    image: ghcr.io/gdi-live/backoffice-back:${IMAGE_VERSION}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy   # backend ya esperó al migrator → las tablas están listas (transitivo)
    environment:
      ENVIRONMENT: production
      # Habilita el wizard "crear instancia" y manda los buckets a MinIO (no Cloudflare).
      LICENSE_MODE: ${LICENSE_MODE:-saas}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      # Credenciales Machine to Machine: SIN ESTO NO SE PUEDE CREAR NINGUN USUARIO
      # (el alta devuelve "Sistema de autenticacion no disponible"). Ver .env.example.
      AUTH0_M2M_CLIENT_ID: ${AUTH0_M2M_CLIENT_ID:-}
      AUTH0_M2M_CLIENT_SECRET: ${AUTH0_M2M_CLIENT_SECRET:-}
      # Client IDs para que el boton de los mails de activacion aterrice donde
      # corresponde: el del portal de usuarios y el del BackOffice.
      AUTH0_FRONTEND_CLIENT_ID: ${AUTH0_FRONTEND_CLIENT_ID:-}
      AUTH0_BACKOFFICE_CLIENT_ID: ${AUTH0_BACKOFFICE_CLIENT_ID:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      # CORS: el backoffice-back acepta requests del backoffice-front
      FRONTEND_URL: ${BACKOFFICE_URL}
      # URL del BackOffice para el bloque "podes ingresar por..." del mail al admin
      BACKOFFICE_FRONT_URL: ${BACKOFFICE_URL}
      # Almacenamiento (BackOffice sube logos/sellos + crea buckets per-tenant en MinIO)
      CF_R2_ENDPOINT: ${CF_R2_ENDPOINT}
      CF_R2_ACCESS_KEY_ID: ${CF_R2_ACCESS_KEY_ID}
      CF_R2_SECRET_ACCESS_KEY: ${CF_R2_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      # Email: Resend si hay key, si no SMTP propio del municipio, si no nada
      # (en ese caso el alta muestra el enlace de activacion en pantalla).
      # Mismas variables que el backend, ahora tambien soportadas por el BackOffice.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FROM_EMAIL: ${FROM_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      # Licencia (.lic montado como volumen, NO variable)
      GDI_LICENSE_DIR: /etc/gdi/license
      GDI_LICENSE_HEARTBEAT_URL: ${GDI_LICENSE_HEARTBEAT_URL:-}
    volumes:
      - ${GDI_LICENSE_HOST_DIR:-./license}:/etc/gdi/license:ro
    networks: [gdi_net]

  # ---------- BackOffice Front ----------
  backoffice-front:
    image: ghcr.io/gdi-live/backoffice-front:${IMAGE_VERSION}
    restart: unless-stopped
    depends_on: [backoffice-back]
    environment:
      # Debe apuntar al backoffice-back (NO al API principal). Requerido en .env.
      NEXT_PUBLIC_API_URL: ${BACKOFFICE_API_URL}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_CLIENT_ID: ${AUTH0_BACKOFFICE_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${AUTH0_BACKOFFICE_CLIENT_SECRET}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      AUTH0_SECRET: ${AUTH0_SECRET}
      AUTH0_BASE_URL: ${BACKOFFICE_URL}
    networks: [gdi_net]

  # ---------- AgenteLANG (IA) ----------
  agentelang:
    image: ghcr.io/gdi-live/agentelang:${IMAGE_VERSION}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # Espera a que las migraciones estén aplicadas: el AIWorker hace SELECT/INSERT
      # sobre tablas/columnas que las migraciones crean.
      migrator:
        condition: service_completed_successfully
    environment:
      # Gate de licencia: corta la IA si el .lic venció o no incluye 'agentelang'.
      LICENSE_MODE: ${LICENSE_MODE:-saas}
      # AgenteLANG usa pydantic-settings: DSN único (DATABASE_URL), no DB_* sueltas.
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      AGENT_GATEWAY_SECRET: ${AGENT_GATEWAY_SECRET:-${INTERNAL_API_KEY}}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      # URLs internas hacia el resto del stack (default del código apunta a localhost)
      GDI_BACKEND_URL: http://backend:8080
      GDI_GATEWAY_URL: http://gateway:8080
      # Modelo IA (opcional). Vacío = default del código (gpt-4.1-nano via OpenRouter).
      # Si lo cambiás y transcribís PDFs importados, usá un modelo multimodal (visión).
      AGENTELANG_MODEL: ${AGENTELANG_MODEL:-}
      # Licencia
      GDI_LICENSE_DIR: /etc/gdi/license
    volumes:
      - ${GDI_LICENSE_HOST_DIR:-./license}:/etc/gdi/license:ro
    networks: [gdi_net]
